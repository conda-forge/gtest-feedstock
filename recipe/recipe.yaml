schema_version: 1

context:
  version: "1.17.0"

recipe:
  name: gtest-split
  version: ${{ version }}

source:
  url: https://github.com/google/googletest/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 65fab701d9829d38cb77c14acdc431d2108bfdbf8979e40eb8ae567edf10b27c

build:
  number: 2

outputs:
  - package:
      name: gtest
    build:
      script:
        file: ${{ "build-gtest.sh" if unix else "build-gtest.bat" }}
    requirements:
      build:
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - cmake
        - ninja
      run_exports:
        - ${{ pin_subpackage('gtest', upper_bound='x.x.x') }}
      run_constraints:
        - gmock ==${{ version }}
    tests:
      - script:
          - if: unix
            then:
              - for lib in gtest gtest_main gmock gmock_main; do test -f "$PREFIX/lib/lib${lib}${SHLIB_EXT}" && test ! -f "$PREFIX/lib/lib${lib}.a"; done
              - for header in gtest/gtest.h gmock/gmock.h; do test -f "$PREFIX/include/${header}"; done
          - if: unix and target_platform != "linux-riscv64"
            then:
              - for lib in gtest gtest_main gmock gmock_main; do pkg-config --print-errors --exact-version "$PKG_VERSION" "$lib"; done
          - if: win
            then:
              - for %%L in (gtest gtest_main gmock gmock_main) do @if not exist %LIBRARY_BIN%\%%L.dll exit 1
              - for %%L in (gtest gtest_main gmock gmock_main) do @if not exist %LIBRARY_LIB%\%%L.lib exit 1
              - if not exist %LIBRARY_INC%\gtest\gtest.h exit 1
              - if not exist %LIBRARY_INC%\gmock\gmock.h exit 1
              - for %%L in (gtest gtest_main gmock gmock_main) do @pkg-config --print-errors --exact-version "%PKG_VERSION%" %%L
        requirements:
          run:
            - if: target_platform != "linux-riscv64"
              then: pkg-config

  # Empty wrapper for compatibility with the previous output separation.
  - package:
      name: gmock
    requirements:
      host:
        - ${{ pin_subpackage('gtest', exact=True) }}
      run:
        - ${{ pin_subpackage('gtest', exact=True) }}
    tests:
      - script:
          - echo "Tested in the gtest output"

about:
  homepage: https://github.com/google/googletest
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Google's C++ test framework

extra:
  recipe-maintainers:
    - SylvainCorlay
    - scopatz
    - wesm
    - marcelotrevisani
    - xhochy
    - h-vetinari
  feedstock-name: gtest
